# ─────────────────────────────────────────────
# Vite + Vue 3 SPA 前端底座 · copier 参数契约
# _envops 把 jinja 标签改为 [[ ]] / [% %] / [# #]，避开 Vue 模板的 {{ }}
# ─────────────────────────────────────────────
_min_copier_version: "9.0.0"

_envops:
  variable_start_string: "[["
  variable_end_string: "]]"
  block_start_string: "[%"
  block_end_string: "%]"
  comment_start_string: "[#"
  comment_end_string: "#]"

# ── 身份 ────────────────────────────────────
project_name:
  type: str
  help: 项目名（小写字母开头，仅字母/数字/连字符）
  validator: >-
    [% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %]
    project_name 必须以小写字母开头，仅含小写字母/数字/连字符
    [% endif %]
  default: "my-app"

project_description:
  type: str
  default: ""

project_title:
  type: str
  default: ""

# ── 接入 ────────────────────────────────────
api_base_url:
  type: str
  default: "/api"

# ── 认证（前端无感刷新机制，与后端 auth_mode 对齐）──
auth_mode:
  type: str
  choices:
    "不接入认证": none
    "不透明 token + Redis 会话（无感刷新）": opaque
  default: opaque

# ── 复制时排除（模板元文件/产物不进消费方）──
_exclude:
  - "copier.yml"
  - "node_modules"
  - "dist"

# ── 复制后按参数裁剪 + 安装依赖 ──
_tasks:
  # auth_mode=none 时移除认证模块、登录页骨架与测试（main/guards/routes/useRequest 的 [% if %] 已同步裁剪引用）
  - command: rm -rf src/auth tests/unit/auth src/views/LoginView.vue
    when: "[[ auth_mode == 'none' ]]"
  # 安装依赖：先检查消费方有无 pnpm，无则提示安装命令
  - command: >-
      if command -v pnpm >/dev/null 2>&1; then
        pnpm install || echo "⚠️ 依赖安装失败，请手动运行: pnpm install";
      else
        echo "⚠️ 未检测到 pnpm 命令，请先安装 pnpm 再安装依赖: npm install -g pnpm && pnpm install";
      fi
